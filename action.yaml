name: 'Releez Version Artifact'

description: 'Generate artifact versions with releez'

inputs:
  releez-version:
    description: 'Version of releez to use'
    required: false
    default: '0.2.6'
  prerelease-type:
    description: 'Type of prerelease (alpha, beta, rc)'
    required: false
    default: ''
  prerelease-number:
    description: 'Prerelease number'
    required: false
    default: '0'
  is-full-release:
    description: 'Indicates if this is a full release'
    required: false
    default: 'false'
  build-number:
    description: 'Build number for the release'
    required: false
    default: ${{ github.run_number }}
  version-override:
    description: 'Override for the next version, otherwise detect it from the repo context'
    required: false
    default: ''
  alias-versions:
    description: 'Type of alias versions to generate (none, major or minor)'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for authentication'
    required: false
    default: '${{ github.token }}'

outputs:
  semver-versions:
    description: 'Generated semantic version versions'
    value: ${{ steps.generate-tags.outputs.semver-versions }}
  docker-versions:
    description: 'Generated Docker versions'
    value: ${{ steps.generate-tags.outputs.docker-versions }}
  pep440-versions:
    description: 'Generated PEP440 (Python) versions'
    value: ${{ steps.generate-tags.outputs.pep440-versions }}

runs:
  using: 'composite'
  steps:
    - name: Check for uv
      id: check-uv
      run: |
        if command -v uv &> /dev/null; then
          echo "found-uv=true" >> "$GITHUB_OUTPUT"
        else
          echo "found-uv=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Install uv
      if: steps.check-uv.outputs.found-uv != 'true'
      uses: astral-sh/setup-uv@v5

    - name: Install releez as tool
      env:
        INPUT_RELEEZ_VERSION: ${{ inputs.releez-version }}
      run: |
        uv tool install releez@"$INPUT_RELEEZ_VERSION"
      shell: bash

    - name: Generate Tags
      id: generate-tags
      env:
        RELEEZ_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_RELEEZ_VERSION: ${{ inputs.releez-version }}
        INPUT_PRERELEASE_TYPE: ${{ inputs.prerelease-type }}
        INPUT_PRERELEASE_NUMBER: ${{ inputs.prerelease-number }}
        INPUT_IS_FULL_RELEASE: ${{ inputs.is-full-release }}
        INPUT_BUILD_NUMBER: ${{ inputs.build-number }}
        INPUT_VERSION_OVERRIDE: ${{ inputs.version-override }}
        INPUT_ALIAS_VERSIONS: ${{ inputs.alias-versions }}
      run: |
        set -euo pipefail

        echo "Generating version tags..."

        commonArgs=()

        if [ -n "$INPUT_PRERELEASE_TYPE" ]; then
            commonArgs+=(
                --prerelease-type "$INPUT_PRERELEASE_TYPE"
                --prerelease-number "$INPUT_PRERELEASE_NUMBER"
            )
        fi

        if [ "$INPUT_IS_FULL_RELEASE" = "true" ]; then
            commonArgs+=(
                --is-full-release
            )
            if [ -n "$INPUT_ALIAS_VERSIONS" ]; then
                commonArgs+=(
                    --alias-versions "$INPUT_ALIAS_VERSIONS"
                )
            fi
        fi

        if [ "$INPUT_IS_FULL_RELEASE" != "true" ] && [ -n "$INPUT_BUILD_NUMBER" ]; then
            commonArgs+=(
                --build-number "$INPUT_BUILD_NUMBER"
            )
        fi

        if [ -n "$INPUT_VERSION_OVERRIDE" ]; then
            commonArgs+=(
                --version-override "$INPUT_VERSION_OVERRIDE"
            )
        fi

        semverVersions=$(uv tool run releez@"$INPUT_RELEEZ_VERSION" version artifact \
            --scheme semver \
            "${commonArgs[@]}"
        )
        dockerVersions=$(uv tool run releez@"$INPUT_RELEEZ_VERSION" version artifact \
            --scheme docker \
            "${commonArgs[@]}"
        )
        pep440Versions=$(uv tool run releez@"$INPUT_RELEEZ_VERSION" version artifact \
            --scheme pep440 \
            "${commonArgs[@]}"
        )

        {
            echo "semver-versions<<EOF"
            echo "$semverVersions"
            echo "EOF"
            echo "docker-versions<<EOF"
            echo "$dockerVersions"
            echo "EOF"
            echo "pep440-versions<<EOF"
            echo "$pep440Versions"
            echo "EOF"
        } >> "$GITHUB_OUTPUT"

        echo "::group::Generated Versions"
        echo "semver-versions: $semverVersions"
        echo "docker-versions: $dockerVersions"
        echo "pep440-versions: $pep440Versions"
        echo "::endgroup::"
      shell: bash
