name: CI checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise tools
        uses: jdx/mise-action@v3

      - name: Sync with pkglink
        run: pkglink sync

      - name: Run dprint check
        run: poe check-dprint

      - name: Run actions checks
        run: poe check-actions

      - name: Run actions tests
        run: poe test-actions
